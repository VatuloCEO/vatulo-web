<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Vatulo</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0f">

<!-- Self-contained on purpose. GitHub Pages serves this file for a miss at any
     depth (/a/b/c/nope), so a relative stylesheet path would resolve against a
     directory that does not exist and the page would arrive unstyled. It is
     small enough to carry its own. -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #0a0a0f;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  .glow {
    position: fixed;
    inset: -30% -10% auto -10%;
    height: 620px;
    pointer-events: none;
    background:
      radial-gradient(50% 46% at 30% 30%, rgba(168, 85, 247, 0.28), transparent 68%),
      radial-gradient(44% 42% at 72% 22%, rgba(236, 72, 153, 0.22), transparent 66%),
      radial-gradient(36% 38% at 55% 50%, rgba(249, 115, 22, 0.14), transparent 70%);
  }
  main { position: relative; max-width: 34rem; display: grid; gap: 20px; justify-items: center; }
  .wordmark {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.045em;
    text-decoration: none;
    background: linear-gradient(100deg, #a855f7, #ec4899);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 { margin: 0; font-size: clamp(1.75rem, 6vw, 2.75rem); letter-spacing: -0.035em; line-height: 1.1; }
  p { margin: 0; color: #9ca3af; font-size: 1.0625rem; line-height: 1.6; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 8px; }
  a.btn {
    display: inline-flex;
    align-items: center;
    padding: 14px 26px;
    border-radius: 999px;
    font-weight: 700;
    text-decoration: none;
    border: 1px solid transparent;
  }
  .brand { background: linear-gradient(100deg, #a855f7, #ec4899 55%, #f97316); color: #fff; }
  .ghost { background: #16161f; border-color: #3a3a48; color: #fff; }
  a:focus-visible { outline: 2px solid #ec4899; outline-offset: 3px; }
</style>
</head>
<body>

<div class="glow" aria-hidden="true"></div>

<main>
  <a class="wordmark" href="/">vatulo</a>
  <h1>This one's not on the list.</h1>
  <p>The page you were looking for isn't here. The door is that way.</p>
  <div class="row">
    <a class="btn brand" href="/">Back to home</a>
    <a class="btn ghost" href="/support/">Support</a>
  </div>
</main>

</body>
</html>
